# Include inside the EXISTING public server {} block, before rewrite/return
# rules that might terminate the request. Keep all existing locations, TLS,
# upstream ports, websocket headers, timeout and request-size settings.
# This if only returns a status; it does not rewrite or change proxy handlers.
if ($sanjie_sensitive_asset) {
    return 404;
}

# Only nonempty login/register POST keys are counted. Separate zones prevent
# a login burst from consuming the registration allowance (and vice versa).
limit_req zone=sanjie_login_ip burst=10 nodelay;
limit_req zone=sanjie_register_ip burst=3 nodelay;
limit_req_status 429;
limit_req_log_level warn;

# Client identity headers MUST be merged into every existing proxy location;
# see README.md. A location with its own limit_req does not inherit the rules
# above: merge both rules/status there instead of replacing its protections.

# Include ONCE inside http {}, before the relevant server {} blocks.
# The keys deliberately ignore all client-provided forwarding headers.
# Empty keys are not counted by limit_req, so asset/API/iframe requests do not
# share either authentication budget. The application still enforces its own
# persistent account/IP controls across processes.
map "$request_method:$uri" $sanjie_login_ip_key {
    default "";
    ~^POST:/api/auth/login/?$ $binary_remote_addr;
}

map "$request_method:$uri" $sanjie_register_ip_key {
    default "";
    ~^POST:/api/auth/register/?$ $binary_remote_addr;
}

limit_req_zone $sanjie_login_ip_key zone=sanjie_login_ip:10m rate=30r/m;
limit_req_zone $sanjie_register_ip_key zone=sanjie_register_ip:10m rate=6r/m;

# Use the normalized $uri, not $request_uri (which includes the raw query).
# The check is performed at server rewrite level, before location selection;
# a ^~ static/download location cannot bypass it.
map $uri $sanjie_sensitive_asset {
    default 0;
    ~*(^|/)\.(git|svn|hg)(/|$) 1;
    ~*(^|/)\.env([.][^/]*)?(/|$) 1;
    ~*(^|/)(private-assets|node_modules|\.next)(/|$) 1;
    ~*(^|/)(package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|composer\.(json|lock)|Dockerfile|docker-compose([.][^/]*)?\.ya?ml|[jt]sconfig([.][^/]*)?\.json)(/|$) 1;
    ~*\.(map|sql|sqlite3?|db|pem|key|p12|pfx|bak|backup|orig|swp)(/|$) 1;
}
